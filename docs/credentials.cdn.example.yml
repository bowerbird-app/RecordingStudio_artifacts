# Example host credentials fragment for RecordingStudioArtifacts CDN publish.
# Merge under Rails credentials (bin/rails credentials:edit) or set ARTIFACT_CDN_* env vars.
# See docs/CDN.md for resolve order and DNS ownership notes.

recording_studio_artifacts:
  api_key: REPLACE_ME
  cdn:
    subdomain: artifacts
    domain: example.com
    path_prefix: recording_studio_artifacts
    # public_base_url: https://artifacts.example.com
    r2_account_id: REPLACE_ME
    r2_access_key_id: REPLACE_ME
    r2_secret_access_key: REPLACE_ME
    r2_bucket: artifacts-prod
    r2_endpoint:
    r2_region: auto
    cloudflare_zone_id: REPLACE_ME
    cloudflare_api_token: REPLACE_ME
